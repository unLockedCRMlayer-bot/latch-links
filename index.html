<meta http-equiv="refresh" content="0;url=https://latchmarket.io/" />
<link rel="canonical" href="https://latchmarket.io/" />
<script>
  // Prefer /links when live; fall back to home so Safari never stays on github.io.
  (async function () {
    var preferred = "https://latchmarket.io/links";
    var fallback = "https://latchmarket.io/";
    try {
      var r = await fetch(preferred, { method: "HEAD", cache: "no-store", redirect: "follow" });
      location.replace(r.ok ? preferred : fallback);
    } catch (e) {
      location.replace(fallback);
    }
  })();
</script>
